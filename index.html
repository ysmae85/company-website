<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 회사 홈페이지</title>
    <style>
        /* 간단한 초기 스타일 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 { margin: 0 0 10px 0; }
        p { line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <h1>환영합니다!</h1>
        <p>우리 회사의 새로운 홈페이지가 준비 중입니다.</p>
    </header>

    <div class="container">
        <h2>회사 소개</h2>
        <p>이곳은 깃허브 페이지를 통해 만들어지고 있는 우리 회사의 공식 홈페이지 공간입니다. 앞으로 멋진 콘텐츠들로 채워질 예정입니다.</p>
        <p><strong>오늘의 진척도:</strong> 저장소 생성 및 첫 화면 띄우기 완료! 🎉</p>
    </div>

</body>
</html>
