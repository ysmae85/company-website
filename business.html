<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)일정 - 사업분야</title>
    <!-- 공통 CSS 연결 -->
    <link rel="stylesheet" href="style.css">
    <!-- 파비콘 연결 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* business.html 전용 스타일 */
        .business-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .business-item {
            background: #f7f9f8;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #d8e3dc;
        }
        .business-item h3 {
            color: #40916c;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="(주)일정 로고">
            (주)일정
        </a>
        <nav>
            <a href="business.html" class="active">사업분야</a>
            <a href="about.html">회사소개</a>
            <a href="index.html" class="home-btn">Home</a>
            <!-- 영문 사업분야 페이지로 이동 -->
            <a href="en/business.html" style="font-weight: bold; color: #2e6f40; margin-left: 10px;">ENG</a>
        </nav>
    </header>

    <!-- 본문 내용 -->
    <div class="main-container">
        <div class="content-card">
            <h1>사업분야 (Business Area)</h1>
            <p>(주)일정이 제공하는 핵심 서비스 및 사업 영역을 소개합니다.</p>
            
            <div class="business-grid">
                <div class="business-item">
                    <h3>01. Condenser Tube Cleaning System</h3>
                    <p>고객 맞춤형 솔루션 제공 및 관련 컨설팅 업무를 수행합니다.</p>
                </div>
                <div class="business-item">
                    <h3>02. Debris Filter</h3>
                    <p>혁신적인 기술 도입과 효율적인 프로세스 구축을 지원합니다.</p>
                </div>
                <div class="business-item">
                    <h3>03. GSC</h3>
                    <p>지속적인 사후 관리와 신뢰도 높은 유지보수 서비스를 제공합니다.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
