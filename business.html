<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)일정 - 사업분야</title>
    <!-- 공통 CSS 연결 -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* business.html 전용 스타일 */
        .business-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .business-item {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .business-item h3 {
            color: #0066cc;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header>
        <a href="index.html" class="logo">(주)일정</a>
        <nav>
            <a href="business.html" class="active">사업분야</a>
            <a href="about.html">회사소개</a>
            <a href="index.html" class="home-btn">Home</a>
        </nav>
    </header>

    <!-- 본문 내용 -->
    <div class="main-container">
        <div class="content-card">
            <h1>사업분야 (Business Area)</h1>
            <p>(주)일정이 제공하는 핵심 서비스 및 사업 영역을 소개합니다.</p>
            
            <div class="business-grid">
                <div class="business-item">
                    <h3>01. 주요 사업 영역 A</h3>
                    <p>고객 맞춤형 솔루션 제공 및 관련 컨설팅 업무를 수행합니다.</p>
                </div>
                <div class="business-item">
                    <h3>02. 주요 사업 영역 B</h3>
                    <p>혁신적인 기술 도입과 효율적인 프로세스 구축을 지원합니다.</p>
                </div>
                <div class="business-item">
                    <h3>03. 부가 서비스 C</h3>
                    <p>지속적인 사후 관리와 신뢰도 높은 유지보수 서비스를 제공합니다.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
